fragment ChatConversationSummaryFragment on ChatConversationSummary {
  conversationId
  category
  context {
    kind
    subtype
    id
    reference
    name
  }
  topic {
    id
    label
  }
  status
  title
  lastMessagePreview
  lastMessageAt
  lastSenderKind
  activityAt
  assignedGroups {
    id
    name
  }
  # Visitor-inbound unread: visible messages not sent by the visitor that sort
  # after the conversation's read cursor. Non-null (a COUNT always yields a
  # value); cleared by `markInAppChatConversationRead`.
  unreadCount
}

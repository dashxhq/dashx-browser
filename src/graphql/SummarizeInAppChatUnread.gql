# Global visitor-inbound unread across every conversation the visitor owns for
# this chat identity — the same owner scope as the inbox list, so a different
# valid chat identity yields 0 rather than an error. Drives the nav badge.
query SummarizeInAppChatUnread($identityId: UUID!) {
  summarizeInAppChatUnread(input: { identityId: $identityId }) {
    count
  }
}
